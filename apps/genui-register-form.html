<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册表单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    padding: 36px 32px;
  }
  h1 {
    font-size: 24px;
    text-align: center;
    color: #1f2430;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #8a8f99;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444a56;
    margin-bottom: 6px;
  }
  label .required { color: #e5484d; margin-left: 2px; }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    border: 1px solid #d6dae2;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18);
  }
  .hint {
    font-size: 12px;
    color: #9aa0aa;
    margin-top: 5px;
  }
  .row {
    display: flex;
    gap: 12px;
  }
  .row .field { flex: 1; }
  .check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: #5a606c;
    margin-bottom: 20px;
  }
  .check input { margin-top: 3px; accent-color: #667eea; }
  .check a { color: #667eea; text-decoration: none; }
  .check a:hover { text-decoration: underline; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.15s;
  }
  button:hover { box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
  button:active { transform: scale(0.98); }
  .footer {
    text-align: center;
    font-size: 13px;
    color: #8a8f99;
    margin-top: 18px;
  }
  .footer a { color: #667eea; text-decoration: none; font-weight: 600; }
  .footer a:hover { text-decoration: underline; }
  .success {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    font-size: 13px;
    color: #1a7f37;
    background: #e8f7ee;
    border-radius: 8px;
    text-align: center;
  }
</style>
</head>
<body>
  <form class="card" id="registerForm" novalidate>
    <h1>创建账号</h1>
    <p class="subtitle">填写以下信息完成注册</p>

    <div class="row">
      <div class="field">
        <label for="firstName">名字<span class="required">*</span></label>
        <input type="text" id="firstName" name="firstName" placeholder="张三" required />
      </div>
      <div class="field">
        <label for="lastName">姓氏<span class="required">*</span></label>
        <input type="text" id="lastName" name="lastName" placeholder="三" required />
      </div>
    </div>

    <div class="field">
      <label for="email">邮箱<span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
    </div>

    <div class="field">
      <label for="password">密码<span class="required">*</span></label>
      <input type="password" id="password" name="password" placeholder="至少 8 位，含字母和数字" required minlength="8" />
      <p class="hint">建议使用大小写字母 + 数字 + 符号组合</p>
    </div>

    <div class="field">
      <label for="confirmPassword">确认密码<span class="required">*</span></label>
      <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required />
    </div>

    <div class="check">
      <input type="checkbox" id="agree" required />
      <label for="agree" style="font-weight: 400; margin: 0;">
        我已阅读并同意 <a href="#">《服务条款》</a> 和 <a href="#">《隐私政策》</a>
      </label>
    </div>

    <button type="submit">注 册</button>
    <div class="success" id="successMsg">✅ 注册信息校验通过！</div>

    <p class="footer">已有账号？<a href="#">去登录</a></p>
  </form>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const pwd = document.getElementById("password").value;
      const pwd2 = document.getElementById("confirmPassword").value;
      if (pwd !== pwd2) {
        alert("两次输入的密码不一致");
        return;
      }
      document.getElementById("successMsg").style.display = "block";
    });
  </script>
</body>
</html>
